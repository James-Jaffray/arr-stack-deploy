# Everything comes from .env (see .env.example). Nothing here should need editing.
name: arr-stack

services:
  # VPN client + kill switch. qBittorrent has no network of its own: it lives inside this
  # container's network namespace, so if the VPN drops, qBittorrent has no route out.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:?Set VPN_PROVIDER in .env}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      # Lets the LAN reach qBittorrent's web UI through the VPN firewall.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:?Set LAN_SUBNET in .env}
      # Optional, provider dependent. Passed as empty when unset. The Gluetun wiki doesn't say
      # how empty values are treated; tested against the current image, which accepts them.
      SERVER_NAMES: ${SERVER_NAMES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:-}
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
    ports:
      # qBittorrent's web UI is published here because qBittorrent shares this network.
      # Gluetun's own control server (8000) is deliberately NOT published.
      - "${BIND_ADDR:-0.0.0.0}:${QBIT_PORT:-8080}:8080"
    volumes:
      - ${CONFIG_DIR:-./config}/gluetun:/gluetun
    restart: unless-stopped

  # No `ports:` and no network of its own (not allowed with network_mode: service:).
  # Other containers must therefore reach it at host `gluetun`, port 8080, NOT `qbittorrent`.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_DIR:-./config}/qbittorrent:/config
      # One shared root so downloads and media are the same filesystem (hardlinks, no copies).
      - ${DATA_DIR:?Set DATA_DIR in .env}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${SONARR_PORT:-8989}:8989"
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      - ${DATA_DIR:?Set DATA_DIR in .env}:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${RADARR_PORT:-7878}:7878"
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${DATA_DIR:?Set DATA_DIR in .env}:/data
    restart: unless-stopped

  # Optional: only starts with `docker compose --profile tunnel up -d`.
  # Public hostnames in the Cloudflare dashboard point at sonarr:8989, radarr:7878,
  # prowlarr:9696, or gluetun:8080 for qBittorrent (it has no network of its own, so never
  # `qbittorrent`). There is no Cloudflare Access in this setup, so every app must have its own
  # login enabled before its hostname is added.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
